<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Formulario</title>
        <link rel="stylesheet" href="css/estilo.css" />
    </head>
    <body>
        <header>
            <h1>Formulario de contacto</h1>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="horario.html">Horario</a>
                <a href="formulario.html">Formulario</a>
            </nav>
        </header>
        <main>
            <h1>Formulario de contacto</h1>
            <form>
                <fieldset>
                    <legend>Datos de contacto</legend>
                    <p>
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Introduce tu nombre" required>
                    </p>
                    <p>
                        <label for="email">Correo electrónico:</label>
                        <input type="email" id="email" name="email" placeholder="Introduce tu correo electrónico" required>
                    </p>
                    <p>
                        <label for="contraseña">Contraseña:</label>
                        <input type="password" id="contraseña" name="contraseña" placeholder="Introduce tu contraseña" required>
                    </p>
                    <p>
                        <label for="teléfono">Teléfono:</label>
                        <input type="tel" id="teléfono" name="teléfono" placeholder="Introduce tu número de teléfono" required>
                    </p>
                    <p>
                        <label for="web">Sitio web:</label>
                        <input type="url" id="web" name="web" placeholder="Introduce la URL de tu sitio web">
                    </p>
                </fieldset>
                <fieldset>
                    <legend>Fechas y Horas</legend>
                    <p>
                        <label for="fecha">Fecha:</label>
                        <input type="date" id="fecha" name="fecha" placeholder="Selecciona una fecha" required>
                    </p>
                    <p>
                        <label for="hora">Hora:</label>
                        <input type="time" id="hora" name="hora" placeholder="Selecciona una hora" required>
                    </p>
                    <p>
                        <label for="fecha y hora">Fecha y Hora:</label>
                        <input type="datetime-local" id="fecha y hora" name="fecha y hora" placeholder="Selecciona una fecha y hora" required>
                    </p>
                    <p>
                        <label for="mes">Mes:</label>
                        <input type="month" id="mes" name="mes" placeholder="Selecciona un mes" required>
                    </p>
                    <p>
                        <label for="semana">Semana:</label>
                        <input type="week" id="semana" name="semana" placeholder="Selecciona una semana" required>
                    </p>
                </fieldset>
                <fieldset>
                    <legend>Valores numéricos</legend>
                    <p>
                        <label for="número">Número:</label>
                        <input type="number" id="número" name="número" placeholder="Introduce un número" required>
                    </p>
                    <p>
                        <label for="rango">Rango:</label>
                        <input type="range" id="rango" name="rango" min="0" max="100" placeholder="Selecciona un valor" required>
                    </p>
                    <p>
                        <label for="color">Color:</label>
                        <input type="color" id="color" name="color" placeholder="Selecciona un color" required>
                    </p>
                </fieldset>
                <fieldset>
                    <legend>Opciones</legend>
                    <p>Selecciona una opción:</p>
                        <input type="radio" id="opcion1" name="opciones" value="opcion1" required>
                        <label for="opcion1">Opción 1</label>
                    <br>
                        <input type="radio" id="opcion2" name="opciones" value="opcion2" required>
                        <label for="opcion2">Opción 2</label>
                    <br>
                        <input type="radio" id="opcion3" name="opciones" value="opcion3" required>
                        <label for="opcion3">Opción 3</label>
                    </p>
                    <p>Selecciona tus intereses:</p>
                        <input type="checkbox" id="interes1" name="intereses" value="interes1">
                        <label for="interes1">Interés 1</label>
                    <br>
                        <input type="checkbox" id="interes2" name="intereses" value="interes2">
                        <label for="interes2">Interés 2</label>
                    <br>
                        <input type="checkbox" id="interes3" name="intereses" value="interes3">
                        <label for="interes3">Interés 3</label>
                    </p>
                </fieldset>
                <fieldset>
                    <legend>Listas</legend>
                    <p>
                        <label for="lista">Selecciona una opción de la lista:</label>
                        <select id="lista" name="lista" required>
                            <option value="">--Selecciona una opción--</option>
                            <option value="opcion1">Opción 1</option>
                            <option value="opcion2">Opción 2</option>
                            <option value="opcion3">Opción 3</option>
                        </select>
                    </p>
                    <p>
                        <label for="lista-multiple">Selecciona múltiples opciones:</label>
                        <select id="lista-multiple" name="lista-multiple" multiple required>
                            <option value="opcion1">Opción 1</option>
                            <option value="opcion2">Opción 2</option>
                            <option value="opcion3">Opción 3</option>
                            <option value="opcion4">Opción 4</option>
                        </select>
                    </p>
                    <p>
                        <label for="lista optgroup">Selecciona un grupo y una opción:</label>
                        <select id="lista optgroup" name="lista optgroup" required>
                            <optgroup label="Grupo 1">
                                <option value="opcion1">Opción 1</option>
                                <option value="opcion2">Opción 2</option>
                            </optgroup>
                            <optgroup label="Grupo 2">
                                <option value="opcion3">Opción 3</option>
                                <option value="opcion4">Opción 4</option>
                            </optgroup>
                        </select>
                    </p>
                </fieldset>
                <fieldset>
                    <legend>Área de texto</legend>
                    <p>
                        <label for="mensaje">Mensaje:</label>
                        <textarea id="mensaje" name="mensaje" rows="4" cols="50" placeholder="Escribe tu mensaje aquí..." required></textarea>
                    </p>
                </fieldset>
                <fieldset>
                    <legend>Otros elementos</legend>
                    <p>
                        <label for="archivo">Subir archivo:</label>
                        <input type="file" id="archivo" name="archivo" required>
                    </p>
                    <p>
                        <label for="datalist">Selecciona una opción:</label>
                        <input type="text" id="datalist" name="datalist" list="opciones">
                        <datalist id="opciones">
                            <option value="Opción 1">
                            <option value="Opción 2">
                            <option value="Opción 3">
                        </datalist>
                    </p>
                    <p>
                        <label for="boton">Botón:</label>
                        <button type="button" id="boton" name="boton">Haz clic aquí</button>
                    </p>
                </fieldset>
            </form>
        </main>
        <footer>
            <p>CIFP Virgen de Gracia</p>
            <p>
                Contacto:
            </p>
        </footer>
    </body>
</html>
